name: Publish release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v0.1.0)
        required: true
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release configuration
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          MACOS_SELF_SIGNED_CERTIFICATE_P12: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE_P12 }}
          MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi

          missing=()
          for name in HOMEBREW_TAP_SSH_KEY MACOS_SELF_SIGNED_CERTIFICATE_P12 MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run deterministic tests
        env:
          PILOT_AEROSPACE_PATH: /not-installed/aerospace
        run: |
          ./script/test.sh
          ./script/test.sh --suite contracts

      - name: Import self-signed code-signing certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD }}

      - name: Trust self-signed code-signing certificate
        run: |
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            .github/signing/AeroSpacePilotCodeSigning.pem

      - name: Select signing identity
        id: signing
        run: |
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\([^"]*AeroSpace Pilot Code Signing[^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "::error::The imported archive contains no AeroSpace Pilot Code Signing identity"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build signed universal app
        env:
          PILOT_BUILD_NUMBER: ${{ github.run_number }}
          PILOT_CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: ./script/package_release.sh "$RELEASE_TAG"

      - name: Verify signed universal app
        run: |
          app="dist/AeroSpace Pilot.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app"
          architectures="$(lipo -archs "$app/Contents/MacOS/AeroSpacePilot")"
          [[ "$architectures" == *arm64* && "$architectures" == *x86_64* ]] || {
            echo "::error::Expected a universal arm64/x86_64 executable, found: $architectures"
            exit 1
          }

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/AeroSpace-Pilot-*.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          archive="dist/release/AeroSpace-Pilot-$version.zip"
          checksum="dist/release/SHA256SUMS.txt"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" "$checksum" --clobber
          else
            flags=()
            if [[ "$version" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$archive" "$checksum" \
              --verify-tag \
              --generate-notes \
              --notes "Install the precompiled universal app by running \`brew trust --cask junderhill/aerospace-pilot/aerospace-pilot\` once, then \`brew install --cask junderhill/aerospace-pilot/aerospace-pilot\`. Xcode is not required." \
              --title "AeroSpace Pilot $version" \
              "${flags[@]}"
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: junderhill/homebrew-aerospace-pilot
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

      - name: Update Homebrew cask
        run: |
          version="${RELEASE_TAG#v}"
          checksum="$(awk '{print $1}' dist/release/SHA256SUMS.txt)"
          python3 script/render_homebrew_cask.py "$version" "$checksum" homebrew-tap/Casks/aerospace-pilot.rb
          ruby -c homebrew-tap/Casks/aerospace-pilot.rb

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/aerospace-pilot.rb
          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew cask already matches $RELEASE_TAG"
          else
            git -C homebrew-tap commit -m "Update AeroSpace Pilot to $version"
            git -C homebrew-tap push origin HEAD:main
          fi
