name: macOS deterministic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: ./script/bootstrap.sh
      - run: ./script/build.sh
      - run: ./script/test.sh
        env:
          PILOT_AEROSPACE_PATH: /not-installed/aerospace
      - run: ./script/test.sh --suite contracts
      - name: Record cumulative gate (desktop remains blocked on hosted CI)
        run: |
          set +e
          ./script/verify.sh --phase 3
          result=$?
          if [ "$result" -ne 0 ] && [ "$result" -ne 3 ]; then exit "$result"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification
          path: artifacts/verification
